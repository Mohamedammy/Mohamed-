<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>التقارير</title>
	<link href="/static/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 min-h-screen p-4">
	<h1 class="text-2xl font-bold mb-4">التقارير</h1>
	<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
		<div class="p-4 bg-white border rounded">
			<h2 class="font-semibold mb-2">تقرير اليوم</h2>
			<button id="loadDaily" class="px-3 py-2 bg-blue-600 text-white rounded">تحميل</button>
			<div class="mt-3 space-y-1">
				<div>إجمالي المبيعات: <span id="ts">0.00</span></div>
				<div>المحصل من المديونية: <span id="dc">0.00</span></div>
				<div>عمولات المندوبين: <span id="cc">0.00</span></div>
			</div>
			<a id="dailyCsv" class="text-blue-700 underline mt-2 inline-block" href="#">تصدير CSV</a>
		</div>
		<div class="p-4 bg-white border rounded">
			<h2 class="font-semibold mb-2">منتجات ناقصة</h2>
			<table class="w-full text-sm border"><thead class="bg-gray-100"><tr><th class="p-2">المنتج</th><th class="p-2">المخزون</th><th class="p-2">حد إعادة الطلب</th></tr></thead><tbody id="low"></tbody></table>
		</div>
	</div>
	<script>
	document.getElementById('loadDaily').addEventListener('click', async ()=>{
		const res = await fetch('/api/reports/daily-summary');
		const d = await res.json();
		document.getElementById('ts').textContent = d.total_sales.toFixed(2);
		document.getElementById('dc').textContent = d.debt_collected.toFixed(2);
		document.getElementById('cc').textContent = d.collector_commissions.toFixed(2);
		document.getElementById('dailyCsv').href = '/api/reports/export/daily-csv';
	});
	(async function(){
		const res = await fetch('/api/reports/low-stock');
		const d = await res.json();
		document.getElementById('low').innerHTML = d.products.map(p=>`<tr class="border-t"><td class="p-2">${p.name}</td><td class="p-2">${p.stock.toFixed(3)}</td><td class="p-2">${p.reorder_level.toFixed(3)}</td></tr>`).join('')
		+ d.weighables.map(w=>`<tr class="border-t"><td class="p-2">${w.name}</td><td class="p-2">${w.stock.toFixed(3)}</td><td class="p-2">${w.reorder_level.toFixed(3)}</td></tr>`).join('');
	})();
	</script>
</body>
</html>
