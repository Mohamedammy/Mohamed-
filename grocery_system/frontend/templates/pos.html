<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>نقطة البيع</title>
	<link href="/static/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 min-h-screen">
	<div class="max-w-6xl mx-auto p-4">
		<h1 class="text-2xl font-bold mb-4">نقطة البيع</h1>
		<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
			<div class="md:col-span-2 space-y-3">
				<div class="flex gap-2">
					<input id="barcode" placeholder="باركود أو اسم" class="flex-1 border rounded px-3 py-2" />
					<button id="addBtn" class="px-4 py-2 bg-blue-600 text-white rounded">إضافة</button>
				</div>
				<table class="w-full text-sm border">
					<thead class="bg-gray-100">
						<tr>
							<th class="p-2">الصنف</th>
							<th class="p-2">الكمية</th>
							<th class="p-2">السعر</th>
							<th class="p-2">الإجمالي</th>
							<th class="p-2">حذف</th>
						</tr>
					</thead>
					<tbody id="items"></tbody>
				</table>
			</div>
			<div class="space-y-3">
				<div class="p-3 bg-white rounded border space-y-2">
					<div class="flex justify-between"><span>الإجمالي:</span><span id="total">0.00</span></div>
					<div class="flex justify-between"><span>المدفوع:</span><input id="paid" type="number" step="0.01" class="w-32 border rounded px-2 py-1 text-right" value="0"/></div>
					<div class="flex justify-between"><span>الباقي:</span><span id="change">0.00</span></div>
					<select id="payment" class="w-full border rounded px-2 py-1">
						<option value="cash">نقدي</option>
						<option value="card">بطاقة</option>
						<option value="debt">آجل</option>
					</select>
					<input id="customerId" placeholder="رقم العميل للآجل" class="w-full border rounded px-2 py-1"/>
					<button id="checkout" class="w-full bg-green-600 text-white py-2 rounded">دفع</button>
				</div>
				<p id="msg" class="text-center text-red-600"></p>
			</div>
		</div>
	</div>
	<script>
	const items = [];
	function render(){
		const tbody = document.getElementById('items');
		tbody.innerHTML = '';
		let total = 0;
		items.forEach((it,idx)=>{
			const line = it.quantity * it.unit_price;
			total += line;
			tbody.insertAdjacentHTML('beforeend', `<tr class="border-t"><td class="p-2">${it.name}</td><td class="p-2"><input type="number" step="0.001" value="${it.quantity}" data-idx="${idx}" class="qty w-24 border rounded px-2 py-1 text-right"/></td><td class="p-2">${it.unit_price.toFixed(2)}</td><td class="p-2">${line.toFixed(2)}</td><td class="p-2"><button data-del="${idx}" class="text-red-600">✖</button></td></tr>`)
		});
		document.getElementById('total').textContent = total.toFixed(2);
		calcChange();
	}
	function calcChange(){
		const total = parseFloat(document.getElementById('total').textContent)||0;
		const paid = parseFloat(document.getElementById('paid').value)||0;
		document.getElementById('change').textContent = (paid-total).toFixed(2);
	}
	document.getElementById('paid').addEventListener('input', calcChange);
	document.getElementById('items').addEventListener('input', (e)=>{
		if(e.target.classList.contains('qty')){
			const idx = +e.target.dataset.idx;
			items[idx].quantity = parseFloat(e.target.value)||0;
			render();
		}
	});
	document.getElementById('items').addEventListener('click', (e)=>{
		if(e.target.dataset.del){ items.splice(+e.target.dataset.del,1); render(); }
	});
	document.getElementById('addBtn').addEventListener('click', async ()=>{
		const code = document.getElementById('barcode').value.trim();
		if(!code) return;
		let res = await fetch(`/api/products/barcode/${encodeURIComponent(code)}`);
		let type = 'product';
		if(!res.ok){
			res = await fetch(`/api/weighable/barcode/${encodeURIComponent(code)}`);
			type = 'weighable';
		}
		if(res.ok){
			const p = await res.json();
			const unit_price = type==='product'? p.unit_price_retail : p.price_per_kg_retail;
			items.push({ type, id: p.id, name: p.name, unit_price, quantity: 1 });
			render();
			document.getElementById('barcode').value='';
		}else{
			document.getElementById('msg').textContent = 'لم يتم العثور على المنتج';
		}
	});
	document.getElementById('checkout').addEventListener('click', async ()=>{
		if(items.length===0) return;
		const fd = new FormData();
		fd.append('items', JSON.stringify(items));
		fd.append('payment_method', document.getElementById('payment').value);
		fd.append('sale_type', 'retail');
		fd.append('amount_paid', document.getElementById('paid').value||'0');
		fd.append('customer_id', document.getElementById('customerId').value||'');
		const res = await fetch('/api/pos/checkout', { method: 'POST', body: fd });
		if(res.ok){ items.length=0; render(); document.getElementById('msg').textContent='تمت العملية'; }
		else{ document.getElementById('msg').textContent='فشل الدفع'; }
	});
	render();
	</script>
</body>
</html>
