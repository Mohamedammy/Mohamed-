<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>بيع بالوزن</title>
	<link href="/static/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 min-h-screen">
	<div class="max-w-4xl mx-auto p-4">
		<h1 class="text-2xl font-bold mb-4">بيع المنتجات بالوزن</h1>
		<div class="space-y-3">
			<div class="flex gap-2">
				<input id="barcode" placeholder="باركود منتج الوزن" class="flex-1 border rounded px-3 py-2" />
				<button id="load" class="px-4 py-2 bg-blue-600 text-white rounded">تحميل</button>
			</div>
			<div id="product" class="p-3 bg-white rounded border hidden"></div>
			<div class="flex gap-2 items-end">
				<div>
					<label class="block mb-1">الوزن (كغ)</label>
					<input id="weight" type="number" step="0.001" class="border rounded px-3 py-2 w-40" />
				</div>
				<button id="readScale" class="px-4 py-2 bg-gray-600 text-white rounded">قراءة من الميزان</button>
				<button id="add" class="px-4 py-2 bg-blue-600 text-white rounded">إضافة للسلة</button>
			</div>
			<table class="w-full text-sm border">
				<thead class="bg-gray-100"><tr><th class="p-2">الصنف</th><th class="p-2">الوزن كغ</th><th class="p-2">السعر/كغ</th><th class="p-2">الإجمالي</th><th class="p-2">حذف</th></tr></thead>
				<tbody id="items"></tbody>
			</table>
			<div class="p-3 bg-white rounded border space-y-2">
				<div class="flex justify-between"><span>الإجمالي:</span><span id="total">0.00</span></div>
				<div class="flex justify-between"><span>المدفوع:</span><input id="paid" type="number" step="0.01" class="w-32 border rounded px-2 py-1 text-right" value="0"/></div>
				<div class="flex justify-between"><span>الباقي:</span><span id="change">0.00</span></div>
				<select id="payment" class="w-full border rounded px-2 py-1">
					<option value="cash">نقدي</option>
					<option value="card">بطاقة</option>
					<option value="debt">آجل</option>
				</select>
				<input id="customerId" placeholder="رقم العميل للآجل" class="w-full border rounded px-2 py-1"/>
				<button id="checkout" class="w-full bg-green-600 text-white py-2 rounded">دفع</button>
				<p id="msg" class="text-center text-red-600"></p>
			</div>
		</div>
	</div>
	<script>
	let current = null;
	const items = [];
	function render(){
		const tbody = document.getElementById('items');
		tbody.innerHTML = '';
		let total = 0;
		items.forEach((it,idx)=>{
			const line = it.quantity * it.unit_price;
			total += line;
			tbody.insertAdjacentHTML('beforeend', `<tr class="border-t"><td class="p-2">${it.name}</td><td class="p-2">${it.quantity.toFixed(3)}</td><td class="p-2">${it.unit_price.toFixed(2)}</td><td class="p-2">${line.toFixed(2)}</td><td class="p-2"><button data-del="${idx}" class="text-red-600">✖</button></td></tr>`)
		});
		document.getElementById('total').textContent = total.toFixed(2);
		const paid = parseFloat(document.getElementById('paid').value)||0;
		document.getElementById('change').textContent = (paid-total).toFixed(2);
	}
	document.getElementById('paid').addEventListener('input', render);
	document.getElementById('items').addEventListener('click', (e)=>{
		if(e.target.dataset.del){ items.splice(+e.target.dataset.del,1); render(); }
	});
	document.getElementById('load').addEventListener('click', async ()=>{
		const code = document.getElementById('barcode').value.trim();
		if(!code) return;
		const res = await fetch(`/api/weighable/barcode/${encodeURIComponent(code)}`);
		if(res.ok){
			current = await res.json();
			document.getElementById('product').classList.remove('hidden');
			document.getElementById('product').innerHTML = `<div><div class='font-semibold mb-1'>${current.name}</div><div class='text-sm text-gray-600'>السعر/كغ (قطاعي): ${current.price_per_kg_retail}</div></div>`;
		}else{
			current = null;
			document.getElementById('product').classList.add('hidden');
		}
	});
	document.getElementById('readScale').addEventListener('click', async ()=>{
		const res = await fetch('/api/weighable/scale/read?port=' + encodeURIComponent(''+(localStorage.getItem('scale_port')||'')));
		if(res.ok){ const d = await res.json(); if(d.weight){ document.getElementById('weight').value = d.weight; } }
	});
	document.getElementById('add').addEventListener('click', ()=>{
		if(!current) return;
		const q = parseFloat(document.getElementById('weight').value)||0;
		if(q<=0) return;
		items.push({ type:'weighable', id: current.id, name: current.name, unit_price: current.price_per_kg_retail, quantity: q });
		render();
		current=null; document.getElementById('product').classList.add('hidden'); document.getElementById('barcode').value=''; document.getElementById('weight').value='';
	});
	document.getElementById('checkout').addEventListener('click', async ()=>{
		if(items.length===0) return;
		const fd = new FormData();
		fd.append('items', JSON.stringify(items));
		fd.append('payment_method', document.getElementById('payment').value);
		fd.append('sale_type', 'weight');
		fd.append('amount_paid', document.getElementById('paid').value||'0');
		fd.append('customer_id', document.getElementById('customerId').value||'');
		const res = await fetch('/api/pos/checkout', { method: 'POST', body: fd });
		if(res.ok){ items.length=0; render(); document.getElementById('msg').textContent='تمت العملية'; }
		else{ document.getElementById('msg').textContent='فشل الدفع'; }
	});
	render();
	</script>
</body>
</html>
